<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minair — Astronomical Observation Planning</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header Banner -->
    <header class="header-banner">
        <div class="header-content">
            <div class="settings-left">
                <div class="setting-group">
                    <label for="location-select">Location:</label>
                    <select id="location-select">
                        <option value="custom">Custom Location</option>
                        <option value="greenwich">Greenwich, UK</option>
                        <option value="mauna-kea">Mauna Kea, Hawaii</option>
                        <option value="atacama">Atacama Desert, Chile</option>
                        <option value="palomar">Palomar Observatory, CA</option>
                    </select>
                </div>
                <div class="custom-location" id="custom-location">
                    <div class="setting-group">
                        <label for="latitude">Lat:</label>
                        <input type="text" id="latitude" placeholder="Latitude" />
                    </div>
                    <div class="setting-group">
                        <label for="longitude">Lon:</label>
                        <input type="text" id="longitude" placeholder="Longitude" />
                    </div>
                </div>
            </div>

            <h1 class="site-title">Minair</h1>

            <div class="settings-right">
                <div class="setting-group">
                    <label for="observation-date">Date:</label>
                    <input type="date" id="observation-date" />
                </div>
                <div class="setting-group">
                    <label for="min-altitude">Min Alt (°):</label>
                    <input type="number" id="min-altitude" value="30" min="0" max="90" />
                </div>
                <div class="setting-group">
                    <label for="theme-select">Theme:</label>
                    <select id="theme-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="red">Night Vision</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Time Display Section -->
    <section class="time-display">
        <div class="clock-container">
            <button class="time-clock" id="utc-clock" data-timezone="utc">
                <div class="time-label">UTC</div>
                <div class="time-value" id="utc-time">--:--:--</div>
            </button>

            <button class="time-clock" id="lst-clock" data-timezone="lst">
                <div class="time-label">LST</div>
                <div class="time-value" id="lst-time">--:--:--</div>
            </button> <button class="time-clock" id="local-clock" data-timezone="local">
                <div class="time-label">
                    <select id="timezone-select" class="timezone-dropdown">
                        <option value="UTC-12">UTC-12:00</option>
                        <option value="UTC-11">UTC-11:00</option>
                        <option value="UTC-10">UTC-10:00</option>
                        <option value="UTC-9:30">UTC-09:30</option>
                        <option value="UTC-9">UTC-09:00</option>
                        <option value="UTC-8">UTC-08:00</option>
                        <option value="UTC-7">UTC-07:00</option>
                        <option value="UTC-6">UTC-06:00</option>
                        <option value="UTC-5">UTC-05:00</option>
                        <option value="UTC-4:30">UTC-04:30</option>
                        <option value="UTC-4">UTC-04:00</option>
                        <option value="UTC-3:30">UTC-03:30</option>
                        <option value="UTC-3">UTC-03:00</option>
                        <option value="UTC-2">UTC-02:00</option>
                        <option value="UTC-1">UTC-01:00</option>
                        <option value="UTC+0">UTC+00:00</option>
                        <option value="UTC+1">UTC+01:00</option>
                        <option value="UTC+2">UTC+02:00</option>
                        <option value="UTC+3">UTC+03:00</option>
                        <option value="UTC+3:30">UTC+03:30</option>
                        <option value="UTC+4">UTC+04:00</option>
                        <option value="UTC+4:30">UTC+04:30</option>
                        <option value="UTC+5">UTC+05:00</option>
                        <option value="UTC+5:30">UTC+05:30</option>
                        <option value="UTC+5:45">UTC+05:45</option>
                        <option value="UTC+6">UTC+06:00</option>
                        <option value="UTC+6:30">UTC+06:30</option>
                        <option value="UTC+7">UTC+07:00</option>
                        <option value="UTC+8">UTC+08:00</option>
                        <option value="UTC+8:30">UTC+08:30</option>
                        <option value="UTC+8:45">UTC+08:45</option>
                        <option value="UTC+9">UTC+09:00</option>
                        <option value="UTC+9:30">UTC+09:30</option>
                        <option value="UTC+10">UTC+10:00</option>
                        <option value="UTC+10:30">UTC+10:30</option>
                        <option value="UTC+11">UTC+11:00</option>
                        <option value="UTC+11:30">UTC+11:30</option>
                        <option value="UTC+12">UTC+12:00</option>
                        <option value="UTC+12:45">UTC+12:45</option>
                        <option value="UTC+13">UTC+13:00</option>
                        <option value="UTC+14">UTC+14:00</option>
                    </select>
                </div>
                <div class="time-value" id="local-time">--:--:--</div>
            </button>
        </div>
    </section>

    <!-- Visibility Graph Section -->
    <section class="graph-section">
        <div class="graph-header">
            <h2>Altitude vs Time</h2>
            <div class="graph-controls">
                <button id="toggle-graph-btn" class="toggle-btn">Show Graph</button>
            </div>
        </div>
        <div class="graph-container" id="graph-container" style="display: none;">
            <canvas id="visibility-chart"></canvas>
        </div>
    </section>

    <!-- Target Management Section -->
    <section class="target-section">
        <div class="target-header">
            <h2>Observation Targets</h2>
        </div>

        <div class="target-table-container">
            <table class="target-table" id="target-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>RA</th>
                        <th>Dec</th>
                        <th>Current Alt</th>
                        <th>Current Az</th>
                        <th>Hour Angle</th>
                        <th>Airmass</th>
                        <th>Rise Time</th>
                        <th>Set Time</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="target-table-body">
                    <!-- Target rows will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Add Target Form -->
        <div class="add-target-form" id="add-target-form">
            <div class="form-row">
                <input type="text" id="target-name" placeholder="Target Name" />
                <input type="text" id="target-ra" placeholder="RA (12:34:56, 12h34m56s, 12 34 56, 123456, 185.25°)" />
                <input type="text" id="target-dec"
                    placeholder="Dec (+12:34:56, 12d34m56s, -12 34 56, +123456, -25.75°)" />
                <button id="lookup-target-btn" title="Query SIMBAD for coordinates">Lookup</button>
                <button id="add-target-btn">Add</button>
            </div>
            <div id="lookup-message" class="lookup-message" style="display: none;"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="src/astronomy.js"></script>
    <script src="src/scheduler.js"></script>
    <script src="src/ui.js"></script>
</body>

</html>
