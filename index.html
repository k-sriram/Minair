<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minair — Astronomical Observation Planning</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
    <!-- Header Banner -->
    <header class="header-banner">
        <div class="header-content">
            <div class="settings-left">
                <div class="setting-group">
                    <label for="location-select">Location:</label>
                    <select id="location-select" class="location-dropdown" tabindex="1">
                        <option value="custom">Custom Location</option>
                        <!-- Observatory options will be populated by JavaScript -->
                    </select>
                </div>
                <div class="custom-location" id="custom-location">
                    <div class="setting-group">
                        <label for="latitude">Lat:</label>
                        <input type="text" id="latitude" placeholder="Latitude" tabindex="2" />
                    </div>
                    <div class="setting-group">
                        <label for="longitude">Lon:</label>
                        <input type="text" id="longitude" placeholder="Longitude" tabindex="3" />
                    </div>
                    <div class="setting-group">
                        <label for="geolocation-btn" style="visibility: hidden;">A</label>
                        <button id="geolocation-btn" class="btn-geolocation full-width btn-secondary btn" type="button"
                            aria-label="Use my current location" title="Use my current location" tabindex="4">
                            <i data-feather="map-pin"></i>
                        </button>
                    </div>
                </div>
            </div>

            <h1 class="site-title">Minair</h1>

            <div class="settings-right">
                <div class="setting-group">
                    <label for="observation-date">Date:</label>
                    <input type="date" id="observation-date" tabindex="5" />
                </div>
                <div class="setting-group">
                    <label for="min-altitude">Min Alt (°):</label>
                    <div class="number-input-wrapper">
                        <input type="text" id="min-altitude" value="30" data-min="0" data-max="90" tabindex="6" />
                        <div class="number-spinner">
                            <button type="button" class="spinner-btn" data-action="increment"
                                title="Increase minimum altitude" tabindex="7">▲</button>
                            <button type="button" class="spinner-btn" data-action="decrement"
                                title="Decrease minimum altitude" tabindex="8">▼</button>
                        </div>
                    </div>
                </div>
                <div class="setting-group">
                    <label for="theme-select">Theme:</label>
                    <select id="theme-select" class="theme-dropdown" tabindex="9">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="red">Night Vision</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Time Display Section -->
    <section class="time-display">
        <div class="clock-container">
            <button class="time-clock" id="utc-clock" data-timezone="utc" title="Use UTC time reference" tabindex="10">
                <div class="time-label">UTC</div>
                <div class="time-value" id="utc-time">--:--:--</div>
            </button>

            <button class="time-clock" id="lst-clock" data-timezone="lst" title="Use local sidereal time reference"
                tabindex="11">
                <div class="time-label">LST</div>
                <div class="time-value" id="lst-time">--:--:--</div>
            </button>
            <button class="time-clock" id="user-clock" data-timezone="user" title="Use selected user timezone"
                tabindex="12">
                <div class="time-label">
                    <select id="timezone-select" class="timezone-dropdown">
                        <option value="UTC-12">UTC-12:00</option>
                        <option value="UTC-11">UTC-11:00</option>
                        <option value="UTC-10">UTC-10:00</option>
                        <option value="UTC-9:30">UTC-09:30</option>
                        <option value="UTC-9">UTC-09:00</option>
                        <option value="UTC-8">UTC-08:00</option>
                        <option value="UTC-7">UTC-07:00</option>
                        <option value="UTC-6">UTC-06:00</option>
                        <option value="UTC-5">UTC-05:00</option>
                        <option value="UTC-4:30">UTC-04:30</option>
                        <option value="UTC-4">UTC-04:00</option>
                        <option value="UTC-3:30">UTC-03:30</option>
                        <option value="UTC-3">UTC-03:00</option>
                        <option value="UTC-2">UTC-02:00</option>
                        <option value="UTC-1">UTC-01:00</option>
                        <option value="UTC+0">UTC+00:00</option>
                        <option value="UTC+1">UTC+01:00</option>
                        <option value="UTC+2">UTC+02:00</option>
                        <option value="UTC+3">UTC+03:00</option>
                        <option value="UTC+3:30">UTC+03:30</option>
                        <option value="UTC+4">UTC+04:00</option>
                        <option value="UTC+4:30">UTC+04:30</option>
                        <option value="UTC+5">UTC+05:00</option>
                        <option value="UTC+5:30">UTC+05:30</option>
                        <option value="UTC+5:45">UTC+05:45</option>
                        <option value="UTC+6">UTC+06:00</option>
                        <option value="UTC+6:30">UTC+06:30</option>
                        <option value="UTC+7">UTC+07:00</option>
                        <option value="UTC+8">UTC+08:00</option>
                        <option value="UTC+8:30">UTC+08:30</option>
                        <option value="UTC+8:45">UTC+08:45</option>
                        <option value="UTC+9">UTC+09:00</option>
                        <option value="UTC+9:30">UTC+09:30</option>
                        <option value="UTC+10">UTC+10:00</option>
                        <option value="UTC+10:30">UTC+10:30</option>
                        <option value="UTC+11">UTC+11:00</option>
                        <option value="UTC+11:30">UTC+11:30</option>
                        <option value="UTC+12">UTC+12:00</option>
                        <option value="UTC+12:45">UTC+12:45</option>
                        <option value="UTC+13">UTC+13:00</option>
                        <option value="UTC+14">UTC+14:00</option>
                    </select>
                </div>
                <div class="time-value" id="user-time">--:--:--</div>
            </button>
        </div>
    </section>

    <!-- Plot Section -->
    <section class="plot-section">
        <div class="plot-header">
            <h2>Altitude vs Time</h2>
            <div class="plot-controls">
                <button id="plot-refresh" class="btn btn-secondary" title="Refresh plot"><i
                        data-feather="refresh-cw"></i></button>
            </div>
        </div>
        <div class="plot-container">
            <canvas id="altitude-plot-canvas"></canvas>
        </div>
    </section>

    <!-- Target Management Section -->
    <section class="target-section">
        <div class="target-header">
            <h2>Observation Targets</h2>
            <div class="target-controls">
                <button id="plot-clear-selection" class="btn btn-secondary" title="Clear selected targets">Clear
                    Selection</button>
                <button id="target-export-csv" class="btn btn-secondary"
                    title="Export the current target table to CSV">Export CSV</button>
                <button id="target-share-link" class="btn btn-secondary"
                    title="Copy a shareable link for the current state">Share Link</button>
                <button id="target-remove-all" class="btn btn-secondary" title="Remove all targets">Remove All</button>
            </div>
        </div>

        <div class="target-table-container">
            <table class="target-table" id="target-table">
                <thead>
                    <tr>
                        <th title="Target name">Name</th>
                        <th title="Right ascension">RA</th>
                        <th title="Declination">Dec</th>
                        <th title="Current altitude above the horizon">Current Alt</th>
                        <th title="Current azimuth">Current Az</th>
                        <th title="Hour angle relative to the local meridian">Hour Angle</th>
                        <th title="Airmass at the current time">Airmass</th>
                        <th title="Estimated rise time">Rise Time</th>
                        <th title="Estimated set time">Set Time</th>
                        <th title="Row actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="target-table-body">
                    <!-- Target rows will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Add Target Form -->
        <div class="add-target-form" id="add-target-form">
            <div class="form-row">
                <input type="text" id="target-name" placeholder="Target Name" />
                <button id="lookup-target-btn" class="btn btn-secondary" title="Query SIMBAD for coordinates"
                    aria-label="Lookup target coordinates"><i data-feather="search"></i></button>
                <input type="text" id="target-ra" placeholder="RA (12:34:56, 12h34m56s, 12 34 56, 123456, 185.25°)" />
                <input type="text" id="target-dec"
                    placeholder="Dec (+12:34:56, 12d34m56s, -12 34 56, +123456, -25.75°)" />
                <button id="add-target-btn" class="btn btn-primary" title="Add target" aria-label="Add target"><i
                        data-feather="plus"></i></button>
            </div>
        </div>
    </section>

    <!-- Copyright Footer -->
    <footer class="copyright-footer">
        <div class="copyright-content">
            <p>&copy; 2025 Sriram Krishna.</p>
        </div>
    </footer>

    <script src="src/astronomy.js"></script>
    <script src="src/scheduler.js"></script>
    <script src="src/catalog.js"></script>
    <script type="module" src="src/modules.js"></script>
    <script src="src/ui.js"></script>
    <script>
        // Initialize Feather icons after page load
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
        });
    </script>
</body>

</html>
